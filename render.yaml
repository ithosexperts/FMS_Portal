services:
  - type: web
    name: fms-portal
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: API_1_URL
        sync: false
      - key: API_2_URL
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: APP_NAME
        value: FMS Portal
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: REQUEST_TIMEOUT
        value: "15"
      - key: PYTHON_VERSION
        value: 3.11.9
