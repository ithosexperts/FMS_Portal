<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Not Found · FMS Portal</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background:var(--bg-body);">
  <div class="card" style="max-width:480px; text-align:center;">
    <h2>404 &mdash; Not Found</h2>
    <p style="color:var(--text-secondary);">{{ message or "The requested resource could not be found." }}</p>

  </div>
</body>
</html>
